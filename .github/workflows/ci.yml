name: Création automatique du JAR

# Le robot se réveille uniquement quand tu pousses un tag
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Installation de Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilation et Création du JAR avec Maven
        run: mvn clean package

      - name: Mise en ligne du JAR sur la page GitHub (Release)
        uses: softprops/action-gh-release@v1
        with:
          files: target/*-shaded.jar # Le nom généré par le plugin Shade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}